<svg viewBox="0 0 460 170" role="img" aria-label="Contract state diagram">
      <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-2)"/></marker></defs>
      <rect x="20" y="55" width="140" height="56" rx="12" fill="var(--salary)" stroke="var(--salary-ink)" stroke-width="1.5"/>
      <text x="90" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="var(--salary-ink)">SALARY</text>
      <text x="90" y="98" text-anchor="middle" font-size="11" fill="var(--ink-2)">guaranteed salary</text>
      <rect x="300" y="55" width="140" height="56" rx="12" fill="var(--commission)" stroke="var(--commission-ink)" stroke-width="1.5"/>
      <text x="370" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="var(--commission-ink)">COMMISSION</text>
      <text x="370" y="98" text-anchor="middle" font-size="11" fill="var(--ink-2)">commission only</text>
      <path d="M160,68 C210,40 250,40 298,68" fill="none" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#arr)"/>
      <text x="230" y="36" text-anchor="middle" font-size="11.5" fill="var(--ink)">3 consecutive FAIL</text>
      <path d="M300,98 C250,126 210,126 162,98" fill="none" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#arr)"/>
      <text x="230" y="140" text-anchor="middle" font-size="11.5" fill="var(--ink)">3 consecutive PASS</text>
      <text x="230" y="162" text-anchor="middle" font-size="10.5" fill="var(--muted)">otherwise the contract stays · change effective 1st of next month</text>
    </svg>
